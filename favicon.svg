<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Coral / Crimson Gradient (Ibuprofen) -->
    <linearGradient id="ibuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Cyan / Sapphire Gradient (Acetaminophen) -->
    <linearGradient id="acetaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="64" height="64" rx="14" fill="#0a0e17"/>

  <!-- Rotating Dual-Pill Capsule Ring -->
  <g filter="url(#glow)">
    <!-- Ibuprofen Arc (Top Left) -->
    <path d="M 19 32 A 13 13 0 0 1 32 19" 
          fill="none" 
          stroke="url(#ibuGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round"/>

    <!-- Connecting Bridge Top Right -->
    <path d="M 32 19 A 13 13 0 0 1 45 32" 
          fill="none" 
          stroke="url(#acetaGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round"/>

    <!-- Acetaminophen Arc (Bottom Right) -->
    <path d="M 45 32 A 13 13 0 0 1 32 45" 
          fill="none" 
          stroke="url(#acetaGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round"/>

    <!-- Connecting Bridge Bottom Left -->
    <path d="M 32 45 A 13 13 0 0 1 19 32" 
          fill="none" 
          stroke="url(#ibuGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round"/>
  </g>
</svg>
